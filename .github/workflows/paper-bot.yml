name: paper-bot
on:
  schedule:
    - cron: "7 * * * *"   # every hour (GitHub may run it a few minutes late)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: paper-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: code }
      - uses: actions/checkout@v4
        with: { ref: paper-data, path: data }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: One bot step
        run: node code/scripts/paper-bot.mjs data/state.json data/REPORT.md
      - name: Show report
        run: cat data/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save state
        working-directory: data
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add -A
          git commit -m "paper bot run $(date -u +%FT%TZ)" || exit 0
          git push
